<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mój Domek</title>
<meta name="description" content="Gra dla dzieci: opiekuj się zwierzątkiem i ucz się angielskiego i matematyki.">
<meta name="theme-color" content="#7A5CFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mój Domek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="start" class="screen">
    <div class="start-sky">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <h1 class="title">Mój Domek</h1>
      <div class="house" aria-hidden="true">
        <div class="roof"></div>
        <div class="walls">
          <div class="win"><span>🐈</span></div>
          <div class="win"><span>🐕</span></div>
          <div class="hdoor"></div>
        </div>
      </div>
      <button id="play" class="play" aria-label="Graj"><span></span></button>
      <p class="hint">🔊 Włącz dźwięk w telefonie</p>
    </div>
    <div class="hills"></div>
  </section>

  <section id="chooser" class="screen" hidden>
    <div class="chooser-top">
      <button id="charBack" class="round-btn" aria-label="Wróć">⬅</button>
      <h2>Kim chcesz być?</h2>
    </div>
    <div id="charGrid" class="tile-grid"></div>
    <button id="charOk" class="ok-btn pop" aria-label="Gotowe" hidden>✔</button>
  </section>

  <section id="home" class="screen" hidden>
    <div id="scene">
      <div id="world" class="world"></div>
      <div id="edge" class="edge" hidden></div>
    </div>
    <header id="hud">
      <button id="meBtn" class="round-btn me" aria-label="Zmień postać">🙂</button>
      <button id="roomIcon" class="round-btn small" aria-label="Pokój">🍳</button>
      <div id="stars" class="stars"></div>
      <button id="badgeBtn" class="round-btn" aria-label="Odznaki">🏅</button>
      <button id="parentBtn" class="round-btn small gear" aria-label="Panel rodzica (przytrzymaj)">⚙️</button>
    </header>
  </section>

  <div id="overlay" hidden></div>
  <div id="bubble" hidden></div>
  <div id="confetti"></div>
</div>
<script src="js/data.js"></script>
<script src="js/phrases.js"></script>
<script src="audio/voice-pack.js"></script>
<script src="js/game.js"></script>
</body>
</html>
