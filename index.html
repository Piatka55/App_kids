<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mój Domek</title>
<meta name="description" content="Gra dla dzieci: podróż ze zwierzakiem, angielski i matematyka krok po kroku.">
<meta name="theme-color" content="#7A5CFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mój Domek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="start" class="screen">
    <div class="start-sky">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <h1 class="title">Mój Domek</h1>
      <div class="house" aria-hidden="true">
        <div class="roof"></div>
        <div class="walls">
          <div class="win"><span>🐈</span></div>
          <div class="win"><span>🐕</span></div>
          <div class="hdoor"></div>
        </div>
      </div>
      <button id="play" class="play" aria-label="Graj"><span></span></button>
      <p class="hint">🔊 Podgłośnij telefon</p>
    </div>
    <div class="hills"></div>
  </section>

  <section id="chooser" class="screen" hidden>
    <div class="chooser-top">
      <button id="chooserBack" class="round-btn" aria-label="Wróć">⬅</button>
      <div id="chooserIcon" class="chooser-icon" aria-hidden="true">🙂</div>
    </div>
    <div id="chooserGrid" class="tile-grid"></div>
    <button id="chooserOk" class="ok-btn pop" aria-label="Gotowe" hidden>✔</button>
  </section>

  <section id="map" class="screen" hidden>
    <div id="mapScroll"><div id="mapWorld"></div></div>
    <header class="map-top">
      <button id="heroBtn" class="round-btn hero" aria-label="Zmień postać">🙂</button>
      <div class="ep-switch">
        <button id="epPrev" class="round-btn small" aria-label="Poprzednia kraina">◀</button>
        <div id="epTitle" class="ep-title"></div>
        <button id="epNext" class="round-btn small" aria-label="Następna kraina">▶</button>
      </div>
      <span class="top-spacer"></span>
    </header>
    <button id="houseBtn" class="house-btn" aria-label="Domek zwierzaka"><span id="houseBtnPet">🏠</span></button>
    <button id="parentBtn" class="round-btn small gear" aria-label="Panel rodzica (przytrzymaj)">⚙️</button>
  </section>

  <section id="level" class="screen" hidden>
    <header class="lv-top">
      <button id="lvClose" class="round-btn" aria-label="Wróć do mapy">✖</button>
      <div class="lv-mid">
        <div id="phases" class="phases"><span data-ph="learn">📖</span><span data-ph="game">🎮</span><span data-ph="reward">🍬</span></div>
        <div class="bar"><i id="lvBar"></i></div>
      </div>
      <button id="lvSkip" class="round-btn small" aria-label="Pomiń naukę" hidden>⏭</button>
      <button id="lvRepeat" class="round-btn" aria-label="Powtórz">🔊</button>
    </header>
    <div id="stage"></div>
    <div id="buddy" class="buddy"></div>
  </section>

  <section id="house" class="screen" hidden>
    <header class="lv-top">
      <button id="houseClose" class="round-btn" aria-label="Wróć do mapy">✖</button>
      <div id="treats" class="treats"></div>
    </header>
    <div class="house-room">
      <div id="housePet" class="house-pet"></div>
      <button id="treatJar" class="treat-jar" aria-label="Smakołyk">🍪</button>
    </div>
    <div class="house-trays">
      <div id="accTray" class="tray"></div>
      <div id="petTray" class="tray"></div>
    </div>
  </section>

  <div id="overlay" hidden></div>
  <div id="bubble" hidden></div>
  <div id="confetti"></div>
</div>
<script src="js/data.js"></script>
<script src="js/phrases.js"></script>
<script src="audio/voice-pack.js"></script>
<script src="js/game.js"></script>
</body>
</html>
